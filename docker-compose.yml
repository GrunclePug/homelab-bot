services:
  homelab-bot:
    build: .
    restart: unless-stopped
    # Room for the bot to finish webhooks (30s) and clicks such as a
    # Replace (90s) before it is killed.
    stop_grace_period: 2m30s
    env_file: .env
    environment:
      LISTEN_ADDR: ":8080"
      DB_PATH: /data/homelab-bot.db
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/homelab-bot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
